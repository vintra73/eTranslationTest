openapi: 3.0.3
info:
  title: eTranslation REST API V2 - Client Callback Interface
  version: 2.0.0
  description: Specification for the endpoint that client systems must implement to receive asynchronous translation responses from the European Commission eTranslation V2 engine.
paths:
  /your-callback-endpoint:
    post:
      summary: Receive Asynchronous Translation Result
      description: This endpoint is invoked by eTranslation to deliver the translation results. It sends separate requests for text snippets or documents per target language.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TextTranslationCallback'
                - $ref: '#/components/schemas/DocumentTranslationCallback'
      responses:
        '200':
          description: OK. The callback notification has been successfully received and acknowledged. This prevents retries.
          content: {}
        '400':
          description: Bad Request. The payload structure does not match the formal eTranslation schema.
        '500':
          description: Internal Server Error. The client system failed to process the incoming payload.

components:
  schemas:
    TextTranslationCallback:
      type: object
      description: Formal payload schema sent when translating plain text snippets (/request/text).
      required:
        - requestId
        - targetLanguage
        - status
      properties:
        requestId:
          type: integer
          format: int64
          description: The unique identifier generated by eTranslation when the request was originally submitted.
          example: 1048576
        targetLanguage:
          type: string
          description: The ISO 639-1 language code of the translated text.
          example: "EN"
        translatedText:
          type: string
          description: The actual translated text. This field may be missing or null if status is 'ERROR'.
          example: "This is the translated response from the EU service."
        status:
          type: string
          enum: [SUCCESS, ERROR]
          description: The processing status of the translation job.
          example: "SUCCESS"
        errorMessage:
          type: string
          nullable: true
          description: Detailed explanation of the failure. Populated only if status is 'ERROR'.
          example: "Translation engine profile mismatch."

    DocumentTranslationCallback:
      type: object
      description: Formal payload schema sent when translating full documents/files (/request/document).
      required:
        - requestId
        - targetLanguage
        - status
      properties:
        requestId:
          type: integer
          format: int64
          description: The unique identifier of the original translation job submission.
          example: 1048577
        targetLanguage:
          type: string
          description: The ISO 639-1 language code of the translated document.
          example: "FR"
        documentId:
          type: integer
          format: int64
          description: The repository identifier of the translated file. Use this ID to invoke the GET download endpoint.
          example: 98765421
        status:
          type: string
          enum: [SUCCESS, ERROR]
          description: The processing status of the document translation.
          example: "SUCCESS"
        errorMessage:
          type: string
          nullable: true
          description: Detailed error log if the file compilation or translation failed.
          example: null
